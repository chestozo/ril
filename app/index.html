    <!-- Version 0.12.01d -->
    <script type="text/javascript">
      window.RIL_VERSION = '0.12.01d'
      window.onerror = function(error_message, url, line_number, error_type) {
  alert(error_message + ' [' + url + ':' + line_number + ']')
}

// Offline mode via Service Worker (replaces the deprecated Application Cache).
// https is a safe production guard: dev server runs on http.
// Path is relative, so it works when the app is served from a subpath (/ril/app/).
// The version query busts both the browser cache and the GitHub Pages CDN
// (both cache sw.js for ~10 minutes, so an un-busted sw.js can lag a release).
// NOTE: sw.js only differs between releases when package.json version is
// bumped - same as the old appcache with its '# Version' comment.
if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
  navigator.serviceWorker
    .register('sw.js?v=' + window.RIL_VERSION, { updateViaCache: 'none' })
    .catch(function(error) {
      console.warn('service worker registration failed', error)
    })

  // Reload app once a new version has taken control
  // (mirrors the old applicationCache 'updateready' auto-swap).
  if (navigator.serviceWorker.controller) {
    var reloading = false
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (reloading) return
      reloading = true
      window.location.reload()
    })
  }
}

    </script>
